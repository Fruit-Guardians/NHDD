name: dependency-graph

on:
  push:
    branches: [main]
    paths:
      - "gui/go.mod"
      - "gui/go.sum"
      - "scripts/go_dependency_snapshot.py"
      - "tests/test_go_dependency_snapshot.py"
      - ".github/workflows/dependency-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go-modules:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dependency Submission API; no alert-management permission.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test full selected-module inventory
        run: python tests/test_go_dependency_snapshot.py
      - name: Verify modules and scan known vulnerabilities
        working-directory: gui
        run: |
          go mod verify
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan=module
      - name: Resolve complete module snapshot
        run: python scripts/go_dependency_snapshot.py --default-branch '${{ github.event.repository.default_branch }}' --output '${{ runner.temp }}/go-snapshot.json'
      - name: Preserve submitted evidence
        uses: actions/upload-artifact@v4
        with:
          name: go-dependency-snapshot
          path: ${{ runner.temp }}/go-snapshot.json
          if-no-files-found: error
      - name: Submit actual dependencies to GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST 'repos/${{ github.repository }}/dependency-graph/snapshots' --input '${{ runner.temp }}/go-snapshot.json'
