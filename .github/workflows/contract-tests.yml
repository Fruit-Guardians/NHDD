name: contract-tests

on:
  push:
    branches: [main, dev]
    paths:
      - "nhdd.c"
      - "fix_dex_checksum.py"
      - "fix_so.py"
      - "gui/**"
      - "README*.md"
      - "BUILD_WINDOWS.md"
      - "nhdd_tui.py"
      - "scripts/**"
      - "NHDD-cpp-modular/**"
      - "tests/**"
      - ".github/workflows/contract-tests.yml"
  pull_request:
    paths:
      - "nhdd.c"
      - "fix_dex_checksum.py"
      - "fix_so.py"
      - "gui/**"
      - "README*.md"
      - "BUILD_WINDOWS.md"
      - "nhdd_tui.py"
      - "scripts/**"
      - "NHDD-cpp-modular/**"
      - "tests/**"
      - ".github/workflows/contract-tests.yml"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"

      - name: Prepare wails embed placeholder
        run: |
          mkdir -p gui/frontend/dist
          echo '<html><body>ci placeholder</body></html>' > gui/frontend/dist/index.html

      - name: Run contract comparison (python / go / v8 / v9 / python_cli)
        run: python3 tests/contract/compare.py

      - name: Public metadata and release privacy regressions
        run: |
          python3 -m pip install rich
          python3 tests/test_public_metadata.py
          python3 tests/test_release_privacy.py
          python3 tests/test_docs_and_security.py
          python3 tests/test_tui_previews.py
          python3 scripts/audit_publication.py

      - name: Check against frozen baseline (if present)
        run: |
          if [ -f tests/contract/expected.json ]; then
            python3 tests/contract/compare.py --check
          else
            echo "expected.json not frozen yet — report-only mode"
          fi

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: contract-report
          path: |
            tests/contract/REPORT.md
            tests/contract/.work/*.json
          if-no-files-found: warn

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  go-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: gui/go.sum
      - run: go mod verify
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -scan=module

  windows-gui:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache-dependency-path: gui/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json
      - name: Build production GUI with the patched tool graph
        env:
          GOFLAGS: -buildvcs=false
        run: go tool wails build -trimpath -ldflags "-s -w -buildid=" -m
